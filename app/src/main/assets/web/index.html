<style>
:root{
--bg-rgb:238,242,250;--bg-a:.35;--card-rgb:255,255,255;--card-a:.64;--surf-rgb:244,247,254;--surf-a:.56;
--bg:rgba(var(--bg-rgb),var(--bg-a));--card:rgba(var(--card-rgb),var(--card-a));--surface:rgba(var(--surf-rgb),var(--surf-a));
--wall-a:1;--wall-img:radial-gradient(circle at 14% 18%,rgba(99,145,255,.32) 0%,transparent 48%),radial-gradient(circle at 86% 12%,rgba(246,135,179,.28) 0%,transparent 46%),radial-gradient(circle at 80% 82%,rgba(72,219,172,.26) 0%,transparent 52%),radial-gradient(circle at 18% 85%,rgba(163,137,244,.25) 0%,transparent 50%),linear-gradient(145deg,#EBF0FA 0%,#F4EFF8 50%,#EAF4F4 100%);
--ink:#0F1420;--ink-2:#313A4D;--sub:#5A657D;--line:rgba(255,255,255,.68);--line-strong:rgba(255,255,255,.88);
--brand:#2B5BF2;--brand-2:#547BF8;--brand-soft:rgba(43,91,242,.13);--brand-glow:rgba(43,91,242,.32);
--accent:#E64866;--accent-soft:rgba(230,72,102,.13);--accent-glow:rgba(230,72,102,.28);
--ok:#109868;--ok-soft:rgba(16,152,104,.14);--ok-glow:rgba(16,152,104,.30);
--warn:#D67408;--warn-btn:#C96D06;--warn-soft:rgba(214,116,8,.15);
--bad:#DE354C;--bad-soft:rgba(222,53,76,.14);
--specular:inset 0 1.5px 1px 0 rgba(255,255,255,.92),inset 0 -1px 1px 0 rgba(255,255,255,.35),inset 1px 0 1px 0 rgba(255,255,255,.45);
--shadow:0 8px 28px -6px rgba(22,34,68,.08),0 2px 6px -1px rgba(22,34,68,.04),var(--specular);
--shadow-lg:0 20px 48px -10px rgba(22,34,68,.13),0 4px 14px -2px rgba(22,34,68,.06),var(--specular);
--glass:rgba(var(--card-rgb),calc(var(--card-a)*.88));--glass-line:rgba(255,255,255,.78);
--blur:blur(26px) saturate(190%);
--serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
--fs-word:42px;--fs-h1:26px;--fs-h2:19px;--fs-lg:16px;--fs-base:14px;--fs-sm:12px;--fs-xs:11px;
--r-card:24px;--r-btn:15px;--r-pill:999px;
--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
--ease:cubic-bezier(.22,1,.36,1);--dur:220ms;
}
html.dark{
--bg-rgb:8,11,19;--bg-a:.42;--card-rgb:20,26,42;--card-a:.58;--surf-rgb:30,39,60;--surf-a:.52;
--wall-img:radial-gradient(circle at 16% 18%,rgba(59,108,246,.34) 0%,transparent 48%),radial-gradient(circle at 85% 15%,rgba(192,72,230,.24) 0%,transparent 46%),radial-gradient(circle at 78% 84%,rgba(24,186,142,.22) 0%,transparent 52%),radial-gradient(circle at 18% 82%,rgba(74,90,220,.26) 0%,transparent 50%),linear-gradient(145deg,#070A12 0%,#0E1322 52%,#09121C 100%);
--ink:#F2F5FC;--ink-2:#C6D0E6;--sub:#8C99B5;--line:rgba(255,255,255,.13);--line-strong:rgba(255,255,255,.24);
--brand:#6E9BFF;--brand-2:#8BB0FF;--brand-soft:rgba(110,155,255,.18);--brand-glow:rgba(110,155,255,.36);
--accent:#FF6B8B;--accent-soft:rgba(255,107,139,.18);--accent-glow:rgba(255,107,139,.32);
--ok:#32D583;--ok-soft:rgba(50,213,131,.18);--ok-glow:rgba(50,213,131,.32);
--warn:#FDB022;--warn-btn:#D9820B;--warn-soft:rgba(253,176,34,.18);
--bad:#F9556D;--bad-soft:rgba(249,85,109,.18);
--specular:inset 0 1px 1px 0 rgba(255,255,255,.24),inset 0 -1px 1px 0 rgba(255,255,255,.06),inset 1px 0 1px 0 rgba(255,255,255,.1);
--shadow:0 12px 32px -6px rgba(0,0,0,.52),0 2px 8px rgba(0,0,0,.35),var(--specular);
--shadow-lg:0 24px 56px -10px rgba(0,0,0,.68),0 6px 18px rgba(0,0,0,.42),var(--specular);
--glass:rgba(var(--card-rgb),calc(var(--card-a)*.84));--glass-line:rgba(255,255,255,.18);
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;padding:0;background:#EBF0FA;color:var(--ink);font-family:var(--sans);font-size:var(--fs-base);line-height:1.52;overflow-x:hidden;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
html.dark{background:#070A12}
body{margin:0;padding:0;background:var(--bg);color:inherit;font-size:inherit;font-family:inherit;line-height:inherit;overflow-x:hidden;transition:background var(--dur) var(--ease)}
body::before{content:"";position:fixed;inset:-8%;z-index:0;pointer-events:none;background-image:var(--wall-img);background-size:cover;background-position:center;background-repeat:no-repeat;opacity:var(--wall-a);filter:saturate(115%);animation:ambientDrift 18s ease-in-out infinite alternate;transition:opacity .4s var(--ease)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.45),transparent 60%);mix-blend-mode:overlay}
html.dark body::before{opacity:calc(var(--wall-a)*.88)}
html.dark body::after{background:radial-gradient(circle at 50% 0%,rgba(110,155,255,.16),transparent 62%)}
@keyframes ambientDrift{0%{transform:scale(1) translate3d(0,0,0)}100%{transform:scale(1.06) translate3d(1.5%,-1.5%,0)}}
#main,.botnav,.topbar{position:relative;z-index:1}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.row{display:flex;align-items:center;gap:var(--sp-2)}
.rsb{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
.col{display:flex;flex-direction:column;gap:var(--sp-4)}
.f1{flex:1;min-width:0}
.sub{font-size:var(--fs-sm);color:var(--sub)}
.xs{font-size:var(--fs-xs);color:var(--sub)}
.tc{text-align:center}
.num{font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}

/* 顶部液态玻璃悬浮栏 */
header.topbar{position:sticky;top:8px;z-index:30;height:54px;margin:8px auto 0;padding:0 var(--sp-4);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line-strong);border-radius:20px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;max-width:928px;width:calc(100% - 24px);gap:var(--sp-2)}
.brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--brand) 0%,#6E56CF 100%);color:#FFF;font-family:var(--serif);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px var(--brand-glow),inset 0 1px 1px rgba(255,255,255,.55)}
.brand-title{font-size:var(--fs-lg);font-weight:800;margin:0;white-space:nowrap;letter-spacing:-.02em;background:linear-gradient(135deg,var(--ink) 30%,var(--brand) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-meta-pill{min-height:36px;padding:0 13px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--surface);backdrop-filter:blur(12px);color:var(--ink-2);font-size:var(--fs-xs);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:var(--specular);transition:all var(--dur) var(--ease)}
.top-meta-pill:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.icon-btn{min-width:44px;min-height:44px;border:none;background:transparent;border-radius:var(--r-btn);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);flex-shrink:0;transition:background var(--dur) var(--ease),transform 120ms var(--ease)}
.icon-btn:hover{background:var(--surface)}
.icon-btn:active{transform:scale(.92)}

main#main{max-width:960px;margin:0 auto;padding:var(--sp-4) var(--sp-4) calc(96px + env(safe-area-inset-bottom));min-height:calc(100vh - 64px)}
body[data-page="study"] header.topbar,body[data-page="study"] nav.botnav{display:none}
body[data-page="study"] main#main{max-width:620px;padding:var(--sp-3) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* 液态玻璃通用卡片 */
.box{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--sp-4);box-shadow:var(--shadow);position:relative;overflow:hidden}
.sec-title{font-size:var(--fs-base);color:var(--ink);font-weight:700;margin:0 0 var(--sp-3);display:flex;justify-content:space-between;align-items:center}
.num-xl{font-size:var(--fs-h1);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.02em}
.num-xl small{font-size:var(--fs-xs);color:var(--sub);font-weight:500;margin-left:3px}
.home-layout{display:grid;grid-template-columns:1fr;gap:var(--sp-4)}
@media (min-width:768px){.home-layout{grid-template-columns:1.15fr .85fr;align-items:start}}

/* 首页主角：液态流光主舞台 */
.hero-stage{position:relative;overflow:hidden;border-radius:28px;padding:var(--sp-5);border:1px solid var(--line-strong);background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow-lg)}
.hero-stage::before{content:"";position:absolute;top:-40%;right:-20%;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,var(--brand-glow) 0%,transparent 70%);pointer-events:none;z-index:0}
.hero-stage::after{content:"";position:absolute;bottom:-45%;left:-15%;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);pointer-events:none;z-index:0}
.hero-stage>*{position:relative;z-index:1}
.hero-stage.scenic{background:linear-gradient(155deg,rgba(var(--card-rgb),.78) 0%,rgba(var(--surf-rgb),.54) 100%);border-color:var(--line-strong)}
html.dark .hero-stage.scenic{background:linear-gradient(155deg,rgba(26,34,56,.76) 0%,rgba(16,22,38,.58) 100%);border-color:rgba(255,255,255,.22)}
.welcome-banner{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:9px 13px;border-radius:14px;background:var(--brand-soft);border:1px solid rgba(43,91,242,.22);color:var(--brand);font-size:var(--fs-xs);font-weight:600;margin-bottom:var(--sp-3);box-shadow:var(--specular)}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.ring-svg{flex-shrink:0;width:68px;height:68px;filter:drop-shadow(0 4px 10px var(--ok-glow))}
.ring-bg{fill:none;stroke:var(--line);stroke-width:6.5}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:6.5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 650ms cubic-bezier(.22,1,.36,1)}
.ring-done .ring-fg{animation:ringPulse 2.2s ease-in-out infinite}
@keyframes ringPulse{0%,100%{filter:drop-shadow(0 0 2px var(--ok-glow))}50%{filter:drop-shadow(0 0 10px var(--ok))}}
.rhythm-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--specular);font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);white-space:nowrap}

/* 双指标液态晶体卡 */
.mission-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin:var(--sp-4) 0}
.mission-card{background:linear-gradient(160deg,rgba(var(--card-rgb),.76) 0%,rgba(var(--surf-rgb),.46) 100%);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line-strong);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.mission-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.mission-card:active{transform:scale(.97)}
.mission-card .m-tag{font-size:var(--fs-xs);color:var(--sub);font-weight:600;display:flex;align-items:center;justify-content:space-between}
.mission-card .m-val{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.12;margin:6px 0 3px;font-family:var(--serif);text-shadow:0 2px 10px rgba(43,91,242,.12)}
.mission-card .m-foot{font-size:var(--fs-xs);color:var(--ink-2);font-weight:500}

/* 液态胶囊选择器 */
.mode-dock{background:var(--surface);backdrop-filter:blur(14px);padding:4px;border-radius:15px;border:1px solid var(--line);box-shadow:inset 0 1px 3px rgba(0,0,0,.06);display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 1fr;gap:4px;margin-bottom:var(--sp-3)}
.mode-chip{min-height:38px;padding:0 4px;border:none;border-radius:11px;background:transparent;color:var(--sub);font-size:var(--fs-xs);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;transition:all var(--dur) var(--ease)}
.mode-chip.on{background:var(--card);color:var(--brand);font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.08),var(--specular)}

/* 弹性微习惯快刷入口 */
.micro-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.micro-btn{flex:1;min-height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);backdrop-filter:blur(12px);color:var(--ink-2);font-size:var(--fs-xs);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;box-shadow:var(--specular);transition:all var(--dur) var(--ease)}
.micro-btn:hover{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);transform:translateY(-1px)}
.micro-btn:active{transform:scale(.97)}

.quote-bar{margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--sub);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
.quote-bar q{font-family:var(--serif);font-style:italic;color:var(--ink-2)}

/* 难度分组切换条 */
.tier-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:inset 0 1px 3px rgba(0,0,0,.05);margin-bottom:var(--sp-3)}
.tier-tab{min-height:42px;padding:0 4px;border:none;border-radius:10px;background:transparent;color:var(--sub);font-size:var(--fs-sm);font-weight:600;cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;transition:all var(--dur) var(--ease)}
.tier-tab small{font-size:10px;opacity:.75;font-variant-numeric:tabular-nums;font-weight:500}
.tier-tab.on{background:var(--card);color:var(--brand);font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.07),var(--specular)}

/* 流光液态按钮体系 */
.btn{min-height:52px;padding:var(--sp-3) var(--sp-4);border-radius:16px;border:1px solid rgba(255,255,255,.32);background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 55%,#6366F1 100%);color:#FFF;font-size:var(--fs-lg);font-weight:700;cursor:pointer;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);transition:transform 140ms var(--ease),filter var(--dur) var(--ease),box-shadow var(--dur) var(--ease);box-shadow:0 10px 24px -4px var(--brand-glow),inset 0 1.5px 1px rgba(255,255,255,.48)}
.btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 14px 28px -4px var(--brand-glow),inset 0 1.5px 1px rgba(255,255,255,.6)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--surface);backdrop-filter:blur(12px);color:var(--brand);border:1.5px solid var(--brand);box-shadow:var(--specular)}
.btn.subtle{background:var(--surface);backdrop-filter:blur(12px);color:var(--ink-2);border:1px solid var(--line-strong);box-shadow:var(--specular);font-size:var(--fs-base);font-weight:600}
.btn.danger{background:linear-gradient(135deg,var(--bad) 0%,#F43F5E 100%);color:#FFF;box-shadow:0 8px 20px -4px rgba(222,53,76,.35)}
.btn.sm{min-height:42px;padding:0 var(--sp-3);font-size:var(--fs-sm);border-radius:12px;width:auto;white-space:nowrap}
.pill-action{min-height:36px;padding:0 12px;border-radius:var(--r-pill);border:1px solid rgba(43,91,242,.2);background:var(--brand-soft);color:var(--brand);font-size:var(--fs-xs);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;box-shadow:var(--specular)}
.pill-action.accent{background:var(--accent-soft);color:var(--accent);border-color:rgba(230,72,102,.2)}

/* 流光进度条 */
.pbar{height:8px;background:var(--surface);border-radius:var(--r-pill);overflow:hidden;position:relative;margin-top:var(--sp-2);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.pbar>i{display:block;height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--brand),#818CF8);transition:width 450ms var(--ease)}
.pbar>b{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--ok),#34D399);box-shadow:0 0 8px var(--ok-glow);transition:width 450ms var(--ease)}

/* 专项入口双卡 */
.action-pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.action-tile{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line-strong);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:92px;box-shadow:var(--shadow);transition:border-color var(--dur) var(--ease),transform 140ms var(--ease),box-shadow var(--dur) var(--ease)}
.action-tile:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.action-tile:active{transform:scale(.97)}

/* 沉浸式学习页（液态光影专注舞台） */
.study-hud{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-3);min-height:44px}
.hud-btn{min-height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--line-strong);background:var(--card);backdrop-filter:blur(16px);color:var(--ink-2);font-size:var(--fs-xs);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;box-shadow:var(--shadow)}
.hud-btn:disabled{opacity:.4;cursor:not-allowed}
.study-prog-wrap{flex:1;display:flex;flex-direction:column;gap:5px;padding:0 4px}
.study-meta{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-xs);color:var(--sub);font-variant-numeric:tabular-nums}
.combo-pill{font-size:var(--fs-xs);font-weight:700;color:var(--warn);background:var(--warn-soft);border:1px solid rgba(214,116,8,.25);padding:1px 9px;border-radius:var(--r-pill);box-shadow:0 2px 8px rgba(214,116,8,.2);animation:comboBounce 240ms var(--ease)}
@keyframes comboBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

.study-stage{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:var(--sp-3)}

.word-card::before{content:"";position:absolute;top:-35%;left:50%;transform:translateX(-50%);width:320px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--brand-glow) 0%,transparent 72%);pointer-events:none;z-index:0;opacity:.65}

@keyframes cardEnter{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.word-card.bounce-ok{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft),0 20px 48px -8px var(--ok-glow),var(--specular)}

@keyframes shakeCard{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.card-topbar{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-xs);color:var(--sub);z-index:2}
.stage-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--specular);color:var(--ink-2);font-size:11px;font-weight:600}
.star-btn{min-width:44px;min-height:44px;border:none;background:transparent;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-pill);color:var(--sub);transition:transform 140ms var(--ease)}
.star-btn:active{transform:scale(1.25)}

.w-main{font-size:var(--fs-word);font-family:var(--serif);font-weight:700;line-height:1.12;letter-spacing:-.025em;color:var(--ink);margin:var(--sp-2) 0 0;word-break:break-word;text-shadow:0 2px 12px rgba(43,91,242,.1)}
.ipa-row{display:inline-flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:var(--sp-2);margin-top:10px;color:var(--sub);font-size:15px}
.ipa-txt{font-family:var(--mono);font-size:13.5px;color:var(--ink-2);background:var(--surface);padding:2px 9px;border-radius:8px;border:1px solid var(--line)}
.audio-pill{min-height:38px;min-width:44px;padding:0 13px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--surface);box-shadow:var(--specular);color:var(--ink-2);font-size:var(--fs-xs);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:all var(--dur) var(--ease)}

.cloze-preview{margin-top:var(--sp-4);padding:14px 16px;background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--line-strong);border-left:3.5px solid var(--brand);border-radius:16px;box-shadow:var(--specular);font-size:15px;color:var(--ink);max-width:520px;width:100%;line-height:1.62;text-align:left;cursor:pointer}
.cloze-blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--brand);color:var(--brand);font-weight:700;text-align:center;padding:0 4px;margin:0 2px;background:var(--brand-soft);border-radius:4px 4px 0 0}
.reveal-zone{width:100%;max-width:520px;margin-top:var(--sp-3);animation:cardEnter 180ms var(--ease);text-align:left}
.meaning-box{font-size:var(--fs-h2);font-weight:700;color:var(--ink);text-align:center;margin-bottom:12px;line-height:1.42;padding:0 6px}

.detail-block .tag-lbl{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--brand-soft);color:var(--brand);margin-right:6px;vertical-align:1px}
.detail-block .tag-lbl.col-tag{background:var(--accent-soft);color:var(--accent)}
.detail-block .tag-lbl.ex-tag{background:var(--ok-soft);color:var(--ok)}
.cf-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cf-btn{min-height:36px;padding:4px 11px;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);box-shadow:var(--specular);font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);cursor:pointer;transition:all var(--dur) var(--ease)}
.cf-btn:hover{border-color:var(--brand);color:var(--brand)}
.tap-reveal-btn{margin-top:auto;margin-bottom:var(--sp-2);min-height:52px;width:100%;max-width:360px;border-radius:var(--r-pill);border:1.5px dashed var(--brand);background:var(--brand-soft);backdrop-filter:blur(12px);color:var(--brand);font-size:var(--fs-base);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);box-shadow:var(--specular);transition:transform 140ms var(--ease)}
.tap-reveal-btn:active{transform:scale(.97)}

/* 液态流光三档评分栏 */
.grade-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:2px}
.grade-btn{min-height:58px;border:1px solid rgba(255,255,255,.28);border-radius:16px;color:#FFF;font-size:var(--fs-base);font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.45),0 8px 20px -4px rgba(0,0,0,.18);transition:transform 130ms var(--ease),filter var(--dur) var(--ease)}

.g-bad{background:linear-gradient(145deg,#EF4444 0%,#CC293D 100%)}
.g-warn{background:linear-gradient(145deg,#F59E0B 0%,#C96D06 100%)}
.g-ok{background:linear-gradient(145deg,#10B981 0%,#0D8A5E 100%)}

/* 选择、拼写、听写液态组件 */
.quiz-opts{width:100%;max-width:520px;display:flex;flex-direction:column;gap:9px;margin-top:var(--sp-3)}
.quiz-opt{min-height:54px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--card);backdrop-filter:blur(12px);box-shadow:var(--specular);color:var(--ink);font-size:var(--fs-base);text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all 150ms var(--ease)}
.quiz-opt:hover:not(:disabled){border-color:var(--brand);transform:translateY(-1px)}
.quiz-opt .opt-k{width:28px;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--sub);font-size:var(--fs-xs);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.quiz-opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:700;box-shadow:0 0 16px var(--ok-glow)}
.quiz-opt.right .opt-k{background:var(--ok);color:#FFF;border-color:transparent}
.quiz-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.quiz-opt.wrong .opt-k{background:var(--bad);color:#FFF;border-color:transparent}

.spell-input{width:100%;max-width:420px;min-height:54px;font-size:26px;font-family:var(--serif);text-align:center;padding:8px 14px;margin-top:var(--sp-3);border:2px solid var(--line-strong);border-radius:16px;background:var(--surface);backdrop-filter:blur(12px);box-shadow:inset 0 2px 4px rgba(0,0,0,.06);color:var(--ink);outline:none;transition:all var(--dur) var(--ease)}
.spell-input::placeholder{font-size:var(--fs-base);font-family:var(--sans);color:var(--sub)}
.spell-input:focus{border-color:var(--brand);background:var(--card);box-shadow:0 0 0 4px var(--brand-soft),var(--specular)}
.spell-input.right{border-color:var(--ok);background:var(--ok-soft)}
.spell-input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.dict-wave-btn{width:78px;height:78px;border-radius:var(--r-pill);border:1.5px solid var(--line-strong);background:radial-gradient(circle at 35% 30%,var(--brand-soft),rgba(43,91,242,.24));box-shadow:0 8px 24px var(--brand-glow),var(--specular);color:var(--brand);font-size:30px;cursor:pointer;margin:var(--sp-2) auto;display:flex;align-items:center;justify-content:center;transition:transform 140ms var(--ease)}
.dict-wave-btn:active{transform:scale(.92)}

/* 词表虚拟滚动：82px双行液态列表 */
.list-toolbar{display:flex;flex-direction:column;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.search-wrap{position:relative;display:flex;align-items:center}
.search-input{width:100%;min-height:46px;padding:0 44px 0 14px;border:1.5px solid var(--line-strong);border-radius:14px;background:var(--card);backdrop-filter:var(--blur);box-shadow:var(--shadow);color:var(--ink);font-size:var(--fs-base);outline:none}
.search-input:focus{border-color:var(--brand)}
.search-clear{position:absolute;right:4px;min-width:40px;min-height:40px;border:none;background:transparent;color:var(--sub);cursor:pointer}
.filter-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:center}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{min-height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--line-strong);background:var(--card);backdrop-filter:blur(12px);box-shadow:var(--specular);color:var(--sub);font-size:var(--fs-xs);font-weight:600;cursor:pointer;white-space:nowrap}
.filter-btn.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700}
.vlist-shell{position:relative;display:flex;gap:var(--sp-2)}
.vlist-viewport{flex:1;height:calc(100vh - 245px);min-height:420px;overflow-y:auto;background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line-strong);border-radius:var(--r-card);box-shadow:var(--shadow);position:relative}
.vlist-spacer{position:relative;width:100%}
.vlist-row{position:absolute;left:0;right:0;height:82px;padding:8px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);cursor:pointer;transition:background 140ms var(--ease)}
.vlist-row:hover{background:var(--surface)}
.vlist-w{font-size:17px;font-weight:700;color:var(--ink);font-family:var(--serif)}
.vlist-ipa{font-size:var(--fs-xs);color:var(--sub);margin-left:6px;font-family:var(--mono);font-weight:400}
.vlist-m{font-size:13px;color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.38}
.vlist-status{font-size:11px;font-weight:600;color:var(--sub);white-space:nowrap;flex-shrink:0;padding:3px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.az-bar{display:flex;flex-direction:column;justify-content:space-between;padding:8px 2px;background:var(--card);backdrop-filter:var(--blur);border:1px solid var(--line-strong);border-radius:var(--r-pill);box-shadow:var(--shadow);user-select:none;width:26px;flex-shrink:0;height:calc(100vh - 245px);min-height:420px}
.az-btn{border:none;background:transparent;color:var(--sub);font-size:10px;font-weight:700;line-height:1;padding:1px 0;cursor:pointer;text-align:center;width:100%}
.az-btn.on{color:var(--brand);transform:scale(1.25)}

/* 统计页：4格液态晶体 + 12周发光热力图 + 流光柱状图 */
.stat-grid-4{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);padding:4px 0}
.stat-cell{background:var(--surface);backdrop-filter:blur(14px);border-radius:16px;padding:12px 14px;border:1px solid var(--line-strong);box-shadow:var(--specular)}
.stat-cell .s-hd{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--sub);margin-bottom:4px;white-space:nowrap}
.heatmap-wrap{overflow-x:auto;padding-bottom:4px}
.heatmap-grid{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3.5px;width:max-content}
.hm-cell{width:12px;height:12px;border-radius:3.5px;background:var(--surface);border:1px solid var(--line)}
.hm-cell[data-lv="1"]{background:rgba(43,91,242,.28)}
.hm-cell[data-lv="2"]{background:rgba(43,91,242,.52)}
.hm-cell[data-lv="3"]{background:rgba(43,91,242,.8)}
.hm-cell[data-lv="4"]{background:var(--ok);box-shadow:0 0 6px var(--ok-glow)}
html.dark .hm-cell[data-lv="1"]{background:rgba(110,155,255,.25)}
html.dark .hm-cell[data-lv="2"]{background:rgba(110,155,255,.52)}
html.dark .hm-cell[data-lv="3"]{background:rgba(110,155,255,.82)}
html.dark .hm-cell[data-lv="4"]{background:var(--ok);box-shadow:0 0 6px var(--ok-glow)}

.bar-chart{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--sp-2);height:98px;align-items:end;padding-top:var(--sp-2)}
.bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar-val{font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.bar-track{width:100%;max-width:24px;height:54px;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.bar-fill{width:100%;background:linear-gradient(180deg,var(--brand-2),var(--brand));border-radius:7px;transition:height 450ms var(--ease);min-height:4px}
.bar-col.is-today .bar-fill{background:linear-gradient(180deg,#34D399,var(--ok));box-shadow:0 0 8px var(--ok-glow)}
.bar-col.is-today .bar-day{color:var(--ink);font-weight:700}
.bar-day{font-size:10px;color:var(--sub)}

/* 设置页与开关 */
.set-group{margin-bottom:var(--sp-4)}
.set-row{min-height:54px;padding:var(--sp-2) 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.set-row:last-child{border-bottom:none}
.set-lbl{font-size:var(--fs-base);font-weight:600;color:var(--ink)}
.set-desc{font-size:var(--fs-xs);color:var(--sub);margin-top:2px}
.ios-switch{position:relative;width:50px;height:30px;min-height:44px;min-width:50px;background:transparent;border:none;padding:7px 0;cursor:pointer;flex-shrink:0}
.ios-track{display:block;width:50px;height:30px;border-radius:var(--r-pill);background:rgba(128,138,160,.32);border:1px solid var(--line);position:relative;transition:background var(--dur) var(--ease)}
.ios-thumb{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#FFF;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform var(--dur) var(--ease)}
.ios-switch[aria-checked="true"] .ios-track{background:var(--ok)}
.ios-switch[aria-checked="true"] .ios-thumb{transform:translateX(20px)}
.seg-ctrl{display:inline-flex;background:var(--surface);padding:3px;border-radius:11px;border:1px solid var(--line)}
.seg-btn{min-height:36px;padding:0 10px;border:none;border-radius:8px;background:transparent;color:var(--sub);font-size:var(--fs-sm);font-weight:600;cursor:pointer;white-space:nowrap}
.seg-btn.on{background:var(--card);color:var(--brand);font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08),var(--specular)}

/* 底部悬浮液态玻璃灵动岛导航 */
nav.botnav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;z-index:30;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line-strong);border-radius:26px;box-shadow:var(--shadow-lg);padding:2px 6px}
.botnav-inner{min-height:56px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav-item{border:none;background:transparent;color:var(--sub);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;border-radius:20px;position:relative;transition:all var(--dur) var(--ease)}
.nav-item svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform 160ms var(--ease)}
.nav-item.on{color:var(--brand);font-weight:700;background:var(--brand-soft);box-shadow:var(--specular)}
.nav-item.on svg{transform:translateY(-1px) scale(1.06)}
.nav-badge{position:absolute;top:4px;right:calc(50% - 22px);background:linear-gradient(135deg,var(--accent),#F43F5E);color:#FFF;font-size:9px;font-weight:700;padding:0 5px;border-radius:99px;line-height:14px;min-width:14px;text-align:center;box-shadow:0 2px 6px var(--accent-glow)}

/* 弹窗、吐司、壁纸选择 */
.modal-mask{position:fixed;inset:0;z-index:60;background:rgba(8,12,24,.48);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:var(--sp-4);animation:cardEnter 180ms var(--ease)}
.modal-card{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line-strong);border-radius:26px;padding:var(--sp-5);max-width:440px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:70;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line-strong);color:var(--ink);padding:9px 18px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:700;box-shadow:var(--shadow-lg);pointer-events:none;white-space:nowrap}
.wp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.wp-cell{height:46px;border-radius:12px;border:2px solid transparent;cursor:pointer;font-size:11px;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 3px rgba(0,0,0,.5);background-size:cover;background-position:center;padding:0;box-shadow:var(--specular)}
.wp-cell.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.wp-pick{display:block;margin-top:10px;padding:10px;border-radius:12px;border:1px dashed var(--brand);text-align:center;font-size:var(--fs-sm);font-weight:600;color:var(--brand);cursor:pointer;background:var(--surface)}
.wp-pick input{display:none}
.wp-range{display:flex;align-items:center;gap:10px;margin-top:10px}
.wp-range span{font-size:var(--fs-xs);color:var(--sub);min-width:62px}
.wp-range input[type=range]{flex:1;accent-color:var(--brand);height:28px}
.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--line) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--r-btn)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>

<script>
const QUOTES=[

{"q":"Imagination is more important than knowledge.","a":"Albert Einstein"},

const FSRS_W=[0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,0.001,1.8722,0.1666,0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
const FSRS_DECAY=-FSRS_W[20];
const FSRS_FACTOR=Math.pow(0.9,1/FSRS_DECAY)-1;
const DESIRED_RETENTION=0.9;

function clamp(v,lo,hi){return Math.min(hi,Math.max(lo,v))}
function fsrsInitS(rating){return Math.max(0.1,FSRS_W[rating-1])}
function fsrsInitD(rating){return clamp(FSRS_W[4]-Math.exp(FSRS_W[5]*(rating-1))+1,1,10)}
function fsrsShortS(s,rating){
const sinc=Math.exp(FSRS_W[17]*(rating-3+FSRS_W[18]))*Math.pow(s,-FSRS_W[19]);
return s*(rating>=3?Math.max(sinc,1):sinc);
}
function fsrsNextD(d,rating){
const deltaD=-FSRS_W[6]*(rating-3);
const damped=deltaD*(10-d)/9;
return clamp(FSRS_W[7]*fsrsInitD(4)+(1-FSRS_W[7])*(d+damped),1,10);
}
function fsrsNextRecallS(d,s,r,rating){
const hardP=rating===2?FSRS_W[15]:1,easyB=rating===4?FSRS_W[16]:1;
const inc=Math.exp(FSRS_W[8])*(11-d)*Math.pow(s,-FSRS_W[9])*(Math.exp((1-r)*FSRS_W[10])-1)*hardP*easyB;
return s*(1+inc);
}
function fsrsNextForgetS(d,s,r){
const lt=FSRS_W[11]*Math.pow(d,-FSRS_W[12])*(Math.pow(s+1,FSRS_W[13])-1)*Math.exp((1-r)*FSRS_W[14]);
const st=s/Math.exp(FSRS_W[17]*FSRS_W[18]);
return Math.min(lt,st);
}
function fsrsInterval(s){
return clamp(Math.round((s/FSRS_FACTOR)*(Math.pow(DESIRED_RETENTION,1/FSRS_DECAY)-1)),1,365);
}
function fsrsRetrievability(sObj,nowMs=Date.now()){
if(!sObj||!isLearnedState(sObj))return 0;
const s=sObj.s||(sObj.iv>0?sObj.iv:0.8);
const lr=sObj.lr||(sObj.due?sObj.due-(sObj.iv||1)*DAY:nowMs);
const elapsed=Math.max(0,(nowMs-lr)/DAY);
return clamp(Math.pow(1+FSRS_FACTOR*elapsed/Math.max(0.1,s),FSRS_DECAY),0,1);
}

function isLearnedState(s){return !!(s&&(s.r>0||s.iv>0))}
const isLearned=w=>{const k=w&&w.w?w.w:w;return isLearnedState(S[k])};
const due=w=>{const k=w&&w.w?w.w:w,s=S[k];return !isLearnedState(s)||s.due<=Date.now()};
const mastered=w=>{const k=w&&w.w?w.w:w,s=S[k];return !!(isLearnedState(s)&&(s.s||s.iv||0)>=8)};
const isWrongOrStar=x=>{const s=S[x.w];return !!(s&&(s.star||(isLearnedState(s)&&(s.g===0||s.iv===0||(s.wCnt>0&&(s.iv||0)<8)))))};

// g: 0=不认识(Again->rating 1), 1=模糊(Hard->rating 2), 2=认识(Good->rating 3), 3=熟知(Easy->rating 4)
function next(s,g,nowMs=Date.now()){
const rating=g===0?1:(g===1?2:(g===3?4:3));
const learned=isLearnedState(s);
let stab=learned?(s.s||(s.iv>0?s.iv:1.2)):0;
let diff=learned?(s.d||clamp(10-((s.e||2.5)-1.3)/1.7*9,1,10)):5;
const prevR=learned?(s.r||1):0;
const lr=learned?(s.lr||(s.due?s.due-(s.iv||1)*DAY:nowMs-DAY)):0;
const elapsedDays=lr>0?Math.max(0,(nowMs-lr)/DAY):null;

if(!learned||stab<=0){
stab=fsrsInitS(rating);
diff=fsrsInitD(rating);
}else if(elapsedDays!==null&&elapsedDays<0.5){
stab=fsrsShortS(stab,rating);
diff=fsrsNextD(diff,rating);
}else{
const r=elapsedDays===null?0.9:Math.pow(1+FSRS_FACTOR*elapsedDays/Math.max(0.1,stab),FSRS_DECAY);
stab=rating===1?fsrsNextForgetS(diff,stab,r):fsrsNextRecallS(diff,stab,r,rating);
diff=fsrsNextD(diff,rating);
}
stab=Math.round(clamp(stab,0.2,365)*100)/100;
diff=Math.round(clamp(diff,1,10)*100)/100;

let iv=0;
if(rating===1){iv=0}
else if(!learned){
iv=rating===2?1:(rating===3?3:7);
stab=Math.max(stab,iv);
}else{
const rawIv=fsrsInterval(stab);
const hardIv=Math.max(1,Math.min(rawIv,Math.round((s.iv||1)*1.25)));
if(rating===2)iv=hardIv;
else if(rating===3){iv=Math.max(2,(s.iv||0)+1,hardIv+1,rawIv);stab=Math.max(stab,iv)}
else{iv=Math.max(4,(s.iv||1)+3,hardIv+2,Math.round(rawIv*1.3));stab=Math.max(stab,iv)}
}
iv=clamp(iv,0,180);
const e=Math.round(clamp(3-(diff-1)/9*1.7,1.3,3)*100)/100;
const dueTime=rating===1?(nowMs+10*MINUTE):(nowMs+iv*DAY);
return{
iv,e,ease:e,due:dueTime,
r:prevR+1,
wCnt:(s?(s.wCnt||0):0)+(rating===1?1:0),
star:s?!!s.star:false,
g:rating===1?0:(rating===2?1:2),
s:stab,d:diff,lr:nowMs
};
}

function getSmartPlan(t=tier){
const p=pool(t),freshN=p.filter(x=>!isLearned(x.w)).length,dueN=p.filter(x=>isLearned(x.w)&&due(x.w)).length;

const daysLeft=Math.max(1,Math.ceil((examMs-todayMs)/DAY));
const bufferDays=daysLeft>14?7:(daysLeft>5?3:0),learnWindow=Math.max(1,daysLeft-bufferDays);
const recSafe=freshN>0?Math.min(500,Math.max(5,Math.ceil(freshN/learnWindow))):15;
let recExact=freshN>0?Math.min(500,Math.max(5,Math.floor(freshN/daysLeft))):10;
if(recExact>=recSafe)recExact=Math.max(5,recSafe-1);
const recCore=freshN>0?Math.min(500,Math.max(5,Math.ceil((highFreshN||Math.round(freshN*.6))/daysLeft))):10;
const useCoreAlt=recSafe>45&&highFreshN>0&&recCore<recExact;
const recAlt=useCoreAlt?recCore:recExact;
const altTitle=useCoreAlt?"⚡ 核心高频保底":"⚡ 考前均摊模式";
const altDesc=useCoreAlt?`优先攻克 ${highFreshN} 个★★★必考词`:`考前按日均摊稳步推进`;
const estDays=freshN>0?Math.ceil(freshN/CFG.daily):0;
const finDate=new Date(todayMs+estDays*DAY),finishDateStr=`${finDate.getMonth()+1}月${finDate.getDate()}日`;
const diffDays=daysLeft-estDays;
let status="good",advice=`节奏从容：预计 ${finishDateStr} 学完，考前留有 ${diffDays} 天总复习缓冲`;
if(freshN===0){status="done";advice="本词书新词已全部过完，保持每日FSRS复习即可稳拿词汇分"}
else if(diffDays<0){status="behind";advice=`距考 ${daysLeft} 天，按 ${recSafe} 词/天可于考前学完（或先专注★★★高频词）`}
else if(diffDays<bufferDays){status="tight";advice=`考前留有 ${diffDays} 天缓冲期，调至 ${recSafe} 词/天更充裕`}
return {freshN,dueN,highFreshN,daysLeft,bufferDays,recSafe,recAlt,altTitle,altDesc,estDays,finishDateStr,diffDays,status,advice};
}

function isSpellMatch(inp,target){
const a=String(inp||"").trim().toLowerCase().replace(/\s+/g," ");
const b=String(target||"").trim().toLowerCase().replace(/\s+/g," ");
if(!a)return false;
if(a===b)return true;
if(b.includes("...")){
const stripped=b.replace(/\s*\.\.\.\s*/g," ").trim();
if(a===stripped||a===b.replace(/\.\.\./g,"sth")||a===b.replace(/\.\.\./g,"sb")||a===b.replace(/\.\.\./g,"something"))return true;
}
if(b.includes("/")){
const m=b.match(/^(.*?)\b([a-z]+)\s*\/\s*([a-z]+)\b(.*)$/);
if(m&&(a===(m[1]+m[2]+m[4]).replace(/\s+/g," ").trim()||a===(m[1]+m[3]+m[4]).replace(/\s+/g," ").trim()))return true;
}
return false;

const esc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
const escH=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escR=s=>String(s||"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

function buildClozeRegex(cl,word){
const w=String(word||"").trim().toLowerCase();
if(!w)return null;
if(w.includes("...")){
const parts=w.split(/\s*\.\.\.\s*/).filter(Boolean).map(escR);
return new RegExp("\\b("+parts.join("|")+")\\b","gi");
}
if(w.includes("/")){
const m=w.match(/^(.*?)\b([a-z]+)\s*\/\s*([a-z]+)\b(.*)$/);
if(m){
const v1=escR((m[1]+m[2]+m[4]).replace(/\s+/g," ").trim());
const v2=escR((m[1]+m[3]+m[4]).replace(/\s+/g," ").trim());
return new RegExp("\\b("+v1+"|"+v2+")\\b","gi");
}
}
const exactForms=[escR(w)+"(?:s|es|d|ed|ing|er|est|ly|men)?",escR(w+w.slice(-1))+"(?:ed|ing|er|est)"];
if(w.includes("-"))exactForms.push(escR(w.replace(/-/g,""))+"(?:s|es|d|ed|ing)?");
else if(w.length>=5)exactForms.push(w.slice(0,2)+"-?"+escR(w.slice(2))+"(?:s|es|d|ed|ing)?");
if(w.endsWith("e")&&w.length>=4)exactForms.push(escR(w.slice(0,-1))+"(?:e|es|ed|ing|er|est|able|ation)");
if(w.endsWith("y")&&w.length>=4)exactForms.push(escR(w.slice(0,-1))+"(?:y|ies|ied|ier|iest|ily)");
if(w.endsWith("f")&&w.length>=4)exactForms.push(escR(w.slice(0,-1))+"ves");
const rg1=new RegExp("\\b("+exactForms.join("|")+")\\b","gi");
if(rg1.test(cl)){rg1.lastIndex=0;return rg1}
const stems=[];
if(w.length>=4){
stems.push(escR(w.slice(0,-1))+"[a-z]*");
if(w.length>=5)stems.push(escR(w.slice(0,-2))+"[a-z]*");
if(w.length>=5)stems.push(escR(w.slice(0,-3))+"[a-z]*");
stems.push(escR(w.slice(0,Math.max(2,w.length-3)))+"[a-z]+");
if(w.startsWith("ae"))stems.push("e"+escR(w.slice(2,-1))+"[a-z]*");
if(w.includes("our"))stems.push(escR(w.replace("our","or").slice(0,-1))+"[a-z]*");
if(w.includes("ll"))stems.push(escR(w.replace("ll","l").slice(0,-2))+"[a-z]*");
if(w.includes("ller"))stems.push(escR(w.replace("ller","lr").slice(0,-1))+"[a-z]*");
if(w.includes("ea"))stems.push(escR(w.replace("ea","o").slice(0,-1))+"[a-z]*");
if(w.endsWith("ative"))stems.push(escR(w.slice(0,-5))+"[a-z]+");
}
if(stems.length){
const rg2=new RegExp("\\b("+stems.join("|")+")\\b","gi");
if(rg2.test(cl)){rg2.lastIndex=0;return rg2}
}
return null;
}

function makeCloze(sent,word,rev){
if(!sent)return "";
const cl=sent.replace(/[\u00a0\u2000-\u200b\u3000]/g," ").replace(/^\.\.\.|\.\.\.$/g,"").trim();
const rg=buildClozeRegex(cl,word);
if(!rg)return escH(cl);
return rev?escH(cl).replace(rg,`<strong style="color:var(--brand);text-decoration:underline;text-underline-offset:3px">$1</strong>`):escH(cl).replace(rg,`<span class="cloze-blank">____</span>`);
}

let filteredWords=[],lastListScroll=0;const ROW_H=82;
function rebuildVirtualList(reset){
const q=listQuery.trim().toLowerCase();
filteredWords=WORDS.filter(x=>{
if(listFilter==="tier"&&x.t!==tier)return false;
if(listFilter==="imp3"&&(x.imp||2)<3)return false;
if(listFilter==="due"&&!(isLearned(x.w)&&due(x.w)))return false;
if(listFilter==="mastered"&&!mastered(x.w))return false;
if(listFilter==="unlearned"&&isLearned(x.w))return false;
return !q||x.w.toLowerCase().includes(q)||x.m.includes(q)||(x.n&&x.n.toLowerCase().includes(q));
});
if(listSort==="imp")filteredWords.sort((a,b)=>(b.imp||2)-(a.imp||2));
else if(listSort==="wrong")filteredWords.sort((a,b)=>((S[b.w]?.wCnt||0)-(S[a.w]?.wCnt||0)));
const cEl=document.getElementById("list-count");if(cEl)cEl.textContent=`${filteredWords.length}词`;
const vp=document.getElementById("v-port");if(vp)vp.scrollTop=reset?0:lastListScroll;
lastVStart=-1;lastVEnd=-1;
onVScroll(true);
}
function onVScroll(force){
const vp=document.getElementById("v-port"),sp=document.getElementById("v-spacer");if(!vp||!sp)return;
lastListScroll=vp.scrollTop;
const total=filteredWords.length;
if(!total){sp.style.height="260px";sp.innerHTML=`<div class="tc sub" style="padding:64px 16px">没有找到匹配的单词，试试其它关键词或切换筛选范围。</div>`;return}
sp.style.height=(total*ROW_H)+"px";
const st=vp.scrollTop,vh=vp.clientHeight||500,s=Math.max(0,Math.floor(st/ROW_H)-4),e=Math.min(total,Math.ceil((st+vh)/ROW_H)+5);
if(!force&&s===lastVStart&&e===lastVEnd)return;
lastVStart=s;lastVEnd=e;
let h="";
for(let i=s;i<e;i++){
const x=filteredWords[i],sr=S[x.w],pn=parseNote(x);
let txt="未学",col="var(--sub)";
if(isLearnedState(sr)){
if(sr.g===0){txt="待强化";col="var(--bad)"}
else if((sr.s||sr.iv||0)>=8){txt=`已记牢 · ${sr.iv||Math.round(sr.s)}d`;col="var(--ok)"}
else{txt=`间隔 ${sr.iv||1}d`;col="var(--brand)"}
}
h+=`<div class="vlist-row" style="top:${i*ROW_H}px" onclick="openWordDetail('${esc(x.w)}')"><div class="f1"><div><span class="vlist-w">${escH(x.w)}</span><span class="vlist-ipa">${escH(x.i||'')}</span>${(x.imp||2)>=3?`<span class="xs" style="color:var(--accent);margin-left:6px;font-weight:700">★★★</span>`:""}</div><div class="vlist-m">${escH(x.m)}${pn.cols.length?` · <span style="color:var(--brand)">${escH(pn.cols[0])}</span>`:(pn.root?` · ${escH(pn.root)}`:"")}</div></div><div class="row"><span class="vlist-status" style="color:${col}">${txt}</span><button type="button" class="icon-btn" style="min-width:36px;min-height:36px" onclick="event.stopPropagation();play('${esc(x.w)}')" aria-label="发音">🔊</button><button type="button" class="star-btn ${sr&&sr.star?'on':''}" onclick="event.stopPropagation();toggleStar('${esc(x.w)}')" aria-label="收藏生词">${sr&&sr.star?'★':'☆'}</button></div></div>`;
}
sp.innerHTML=h;
}

// O(1) 单题干扰项生成：优先同易混词 + 同词性抽样，毫秒级0卡顿
function ensureQuizOpts(w){
if(!w)return;
const pm=w.m?w.m.match(/^[a-z]+\./i):null;
const pk=pm?pm[0].toLowerCase():"_";
const bucket=POS_BUCKETS[pk]||WORDS;
const picked=[];
if(w.cf&&w.cf.length){
for(const [cw] of w.cf){
if(picked.length>=2)break;
const target=WORD_MAP.get(String(cw).toLowerCase());
if(target&&target.w!==w.w&&target.m!==w.m&&!picked.includes(target.m))picked.push(target.m);
}
}
let guard=0;
while(picked.length<3&&guard<40){
guard++;
const cand=bucket[Math.floor(Math.random()*bucket.length)];
if(cand&&cand.w!==w.w&&cand.m!==w.m&&!picked.includes(cand.m))picked.push(cand.m);
}
w._opts=[w.m,...picked].sort(()=>Math.random()-.5);
w._ans=w._opts.indexOf(w.m);
}
function prepQuiz(list){if(Array.isArray(list))list.forEach(ensureQuizOpts)}

// 全局单例音频控制器：优先调用Android内置真人发音，彻底消除双音轨重叠、AbortError竞态与4秒长句误弹窗Bug
let currentAudio=null,currentAudioTimer=null;
function stopAudio(){
if(currentAudioTimer){clearTimeout(currentAudioTimer);currentAudioTimer=null}
if(currentAudio){
try{
currentAudio.onplaying=null;currentAudio.oncanplaythrough=null;currentAudio.onended=null;currentAudio.onerror=null;
currentAudio.pause();currentAudio.src="";
}catch(e){}
currentAudio=null;
}
}
function sanitizeAudioText(w){
return String(w||"").replace(/[\u00a0\u2000-\u200b\u3000]/g," ").replace(/\s*\.\.\.\s*/g," something ").replace(/\s*\/\s*/g," or ").trim();
}
function nativePlay(w){
try{
const t=String(w||"").trim();
if(!t||t.length>48)return false;
return window.AndroidAudio&&typeof window.AndroidAudio.play==="function"?!!window.AndroidAudio.play(t):false;
}catch(e){return false}
}
function play(w){
if(!w)return;
stopAudio();
const raw=String(w).trim();
if(raw.length>48){playLongSentence(raw);return}
if(nativePlay(raw))return;
const cleanW=sanitizeAudioText(raw);
if(!cleanW)return;
try{
const a=new Audio("https://dict.youdao.com/dictvoice?type=2&audio="+encodeURIComponent(cleanW));
currentAudio=a;
let started=false;
currentAudioTimer=setTimeout(()=>{if(currentAudio===a&&!started){started=true;playTts(cleanW)}},2200);
const markOk=()=>{if(currentAudio===a&&!started){started=true;if(currentAudioTimer){clearTimeout(currentAudioTimer);currentAudioTimer=null}}};
a.onplaying=markOk;a.oncanplaythrough=markOk;a.onended=markOk;
a.onerror=()=>{if(currentAudio===a&&!started){started=true;if(currentAudioTimer)clearTimeout(currentAudioTimer);playTts(cleanW)}};
const p=a.play();
if(p&&p.then)p.then(markOk).catch(()=>{if(currentAudio===a&&!started){started=true;if(currentAudioTimer)clearTimeout(currentAudioTimer);playTts(cleanW)}});
}catch(e){playTts(cleanW)}
}
function playSentence(t){
if(!t)return;
const s=String(t).replace(/[\u00a0\u2000-\u200b\u3000]/g," ").replace(/^\.\.\.|\.\.\.$/g,"").trim();
if(!s)return;
if(s.length>48||(/\s/.test(s)&&!WORD_MAP.has(s.toLowerCase()))){playLongSentence(s);return}
play(s);
}
function ttsUrl(t){return "https://fanyi.baidu.com/gettts?lan=en&text="+encodeURIComponent(t)+"&spd=3&source=web"}
function playLongSentence(s){
stopAudio();
const cleanS=String(s||"").replace(/[\u00a0\u2000-\u200b\u3000]/g," ").trim();
if(!cleanS)return;
try{
const a=new Audio(ttsUrl(cleanS));
currentAudio=a;
let started=false;
currentAudioTimer=setTimeout(function(){if(currentAudio===a&&!started){started=true;showToast("例句朗读需联网")}},4500);
const markOk=function(){if(currentAudio===a&&!started){started=true;if(currentAudioTimer){clearTimeout(currentAudioTimer);currentAudioTimer=null}}};
a.onplaying=markOk;a.oncanplaythrough=markOk;a.onended=markOk;
a.onerror=function(){if(currentAudio===a&&!started){started=true;if(currentAudioTimer)clearTimeout(currentAudioTimer);showToast("例句朗读需联网")}};
const p=a.play();
if(p&&p.then)p.then(markOk).catch(function(){if(currentAudio===a&&!started){started=true;if(currentAudioTimer)clearTimeout(currentAudioTimer);showToast("例句朗读需联网")}});
}catch(e){showToast("例句朗读需联网")}
}
function playTts(t){
stopAudio();
const cleanT=sanitizeAudioText(t);
if(!cleanT)return;
try{
const a=new Audio(ttsUrl(cleanT));
currentAudio=a;
a.play().catch(function(){});
}catch(e){}
}
function tts(w){if(nativePlay(w))return;playTts(w)}
window.play=play;window.playTts=playTts;window.tts=tts;

function grade(g){
clearTimeout(window.__qzTimer);
if(page!=="study")return;
const w=Q[qi];if(!w)return;
historyStack.push({qi,word:w.w,prevS:S[w.w]?Object.assign({},S[w.w]):null,prevCombo:combo,prevMaxCombo:maxCombo,qLen:Q.length,swLen:sessionWrong.length,prevTyped:typed,prevHintLv:hintLv,prevQuizPick:quizPick,prevOpts:w._opts?w._opts.slice():null,prevAns:w._ans,prevRevealed:revealed,prevChecked:checked});
S[w.w]=next(S[w.w],g);bump(1);doneCnt++;
if(g===0){
combo=0;sessionWrong.push(w);
w._opts=null; // 重入队尾时清空旧选项顺序，防止位置记忆盲选
Q.push(w);cardBounce="bounce-bad";
}else{
combo++;if(combo>maxCombo)maxCombo=combo;cardBounce="bounce-ok";
if(combo===5||combo===10||combo===20)showToast(`🔥 ${combo} 连击达成！保持这个节奏`);
}
qi++;revealed=false;quizPick=-1;typed="";retryTyped="";checked=false;hintLv=0;dictPeek=false;
saveSession();render();
if(Q[qi]&&(CFG.auto||resolveCardMode(Q[qi])==="dict"))play(Q[qi].w);
}
function killWord(){
clearTimeout(window.__qzTimer);
if(page!=="study")return;
const w=Q[qi];if(!w)return;
historyStack.push({qi,word:w.w,prevS:S[w.w]?Object.assign({},S[w.w]):null,prevCombo:combo,prevMaxCombo:maxCombo,qLen:Q.length,swLen:sessionWrong.length,prevTyped:typed,prevHintLv:hintLv,prevQuizPick:quizPick,prevOpts:w._opts?w._opts.slice():null,prevAns:w._ans,prevRevealed:revealed,prevChecked:checked,wasKilled:true});
S[w.w]={iv:30,e:2.6,ease:2.6,s:30,d:3.2,lr:Date.now(),due:Date.now()+30*DAY,r:(S[w.w]?.r||0)+1,wCnt:S[w.w]?.wCnt||0,star:!!S[w.w]?.star,g:2};
bump(1);doneCnt++;combo++;if(combo>maxCombo)maxCombo=combo;
qi++;revealed=false;quizPick=-1;typed="";retryTyped="";checked=false;hintLv=0;dictPeek=false;
saveSession();showToast(`⚡ 已标熟斩词：${w.w}（30天内不再打扰）`);render();
if(Q[qi]&&(CFG.auto||resolveCardMode(Q[qi])==="dict"))play(Q[qi].w);
}
function prevWord(){
clearTimeout(window.__qzTimer);stopAudio();
if(!historyStack.length)return;
const ls=historyStack.pop();
if(ls.prevS)S[ls.word]=ls.prevS;else delete S[ls.word];
while(Q.length>ls.qLen)Q.pop();
while(sessionWrong.length>ls.swLen)sessionWrong.pop();
qi=ls.qi;combo=ls.prevCombo;maxCombo=ls.prevMaxCombo;doneCnt=Math.max(0,doneCnt-1);
bump(-1);
const w=Q[qi];
if(w&&ls.prevOpts){w._opts=ls.prevOpts;w._ans=ls.prevAns}
const curM=resolveCardMode(w);
typed=ls.prevTyped||"";retryTyped="";hintLv=ls.prevHintLv||0;quizPick=ls.prevQuizPick??-1;
if(ls.wasKilled&&!ls.prevRevealed&&!ls.prevChecked){
revealed=false;checked=false;
}else{
revealed=true;checked=curM==="type"||curM==="dict";
}
saveSession();render();showToast("↩ 已回退到上一词，FSRS状态已回滚");
}
function pick(i){
const w=Q[qi];if(!w||revealed)return;
quizPick=i;revealed=true;play(w.w);render();
if(CFG.quizAuto&&i===w._ans){clearTimeout(window.__qzTimer);window.__qzTimer=setTimeout(()=>grade(2),520)}
}
function giveHint(){
const w=Q[qi];if(!w)return;
const maxReveal=Math.max(1,w.w.length-2);
hintLv=Math.min(maxReveal,hintLv+1);
typed=w.w.slice(0,hintLv);
render();
}
function checkType(gu){
const w=Q[qi];if(!w)return;
const ti=document.getElementById("ti");
if(ti&&!gu)typed=ti.value;
if(gu)typed="";
retryTyped="";checked=true;revealed=true;play(w.w);render();
}

function bindStudySwipe(){
const c=document.getElementById("study-card");if(!c)return;
let sx=0,sy=0,dx=0,dy=0,tr=false;
c.addEventListener("touchstart",e=>{
const tg=e.target&&e.target.tagName;
if(tg==="INPUT"||tg==="TEXTAREA"||tg==="BUTTON")return;
if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;dy=0;tr=true}
},{passive:true});
c.addEventListener("touchmove",e=>{
if(!tr)return;
dx=e.touches[0].clientX-sx;dy=e.touches[0].clientY-sy;
if(Math.abs(dx)>Math.abs(dy)*1.5&&Math.abs(dx)>15)c.style.transform=`translateX(${dx*.35}px) rotate(${dx*.02}deg)`;
},{passive:true});
c.addEventListener("touchcancel",()=>{tr=false;dx=0;dy=0;c.style.transform=""},{passive:true});
c.addEventListener("touchend",()=>{
if(!tr)return;
tr=false;c.style.transform="";
if(Math.abs(dx)>68&&Math.abs(dx)>Math.abs(dy)*1.5){
const cm=resolveCardMode(Q[qi]);
if(cm==="card"&&!revealed){reveal();return}
if(cm==="quiz"&&!revealed)return;
if((cm==="type"||cm==="dict")&&!checked)return;
grade(dx<0?0:2);
}
});
}

window.addEventListener("keydown",e=>{
const modalEl=document.getElementById("modal-root");
if(modalEl&&modalEl.innerHTML.trim()){
if(e.key==="Escape"){e.preventDefault();closeModal()}
return;
}
if(page!=="study")return;
if(!Q[qi]){
if(e.key==="Escape"||e.key===" "||e.code==="Space"||e.key==="Enter"){e.preventDefault();go("home")}
return;
}
const curM=resolveCardMode(Q[qi]);
const activeEl=document.activeElement;
const tg=activeEl?activeEl.tagName:"";
if(tg==="INPUT"||tg==="TEXTAREA"){
if(e.key==="Escape"){activeEl.blur();finishOrExitStudy();return}
// 若已核对答案（checked===true），允许空格/回车/数字键直接推进，彻底修复焦点卡死Bug
if(checked){
if(activeEl.id==="retry-ti"&&retryTyped.trim().length>0)return;
if(e.key===" "||e.code==="Space"||e.key==="Enter"){
e.preventDefault();
grade(isSpellMatch(typed,Q[qi].w)&&hintLv===0?2:0);
return;
}
if(e.key==="1"||e.key==="2"||e.key==="3"){
e.preventDefault();
grade(Number(e.key)-1);
return;
}
}
return;
}
if(e.key==="Escape"){e.preventDefault();finishOrExitStudy();return}
if(e.key==="ArrowLeft"){e.preventDefault();prevWord();return}
if(e.key.toLowerCase()==="s"){e.preventDefault();toggleStar(Q[qi].w);return}
if(e.key.toLowerCase()==="m"||e.key==="Delete"){e.preventDefault();killWord();return}
if(e.key===" "||e.code==="Space"){
e.preventDefault();
if(curM==="card"&&!revealed)reveal();
else if(curM==="quiz"&&revealed)grade(quizPick===Q[qi]._ans?2:0);
else if((curM==="type"||curM==="dict")&&checked)grade(isSpellMatch(typed,Q[qi].w)&&hintLv===0?2:0);
else if(revealed)grade(2);
return;
}
if(curM==="quiz"&&!revealed){const ix=["1","2","3","4","a","b","c","d"].indexOf(e.key.toLowerCase());if(ix!==-1){e.preventDefault();pick(ix%4);return}}
if(revealed||checked){if(e.key==="1"){e.preventDefault();grade(0)}else if(e.key==="2"){e.preventDefault();grade(1)}else if(e.key==="3"){e.preventDefault();grade(2)}}
});

function quickExamOffset(days){
const d=new Date(Date.now()+days*DAY);
const s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
setExamDate(s,true);
}

function exportP(){
const j=JSON.stringify({srs:S,hist:H,cfg:CFG,tier,mode}),imp=document.getElementById("imp");if(imp)imp.value=j;
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(j).then(()=>{msg="✅ 进度已复制到剪贴板，同时显示在上方文本框中";showToast("已复制备份 JSON");render()}).catch(()=>{msg="已生成备份 JSON，请全选复制上方文本框内容保存";render()});
else{msg="已生成备份 JSON，请全选复制上方文本框内容保存";render()}
}
function importP(){
try{
const v=(document.getElementById("imp")?.value||"").trim();if(!v){msg="请先粘贴备份 JSON 内容";render();return}
const o=JSON.parse(v);
if(o&&typeof o.srs==="object"&&!Array.isArray(o.srs)){
S=o.srs;H=(o.hist&&typeof o.hist==="object"&&!Array.isArray(o.hist))?o.hist:{};CFG=Object.assign(CFG,o.cfg||{});
sanitizeState();
if(o.tier&&TIERS.some(x=>x[0]===o.tier)){tier=o.tier;localStorage.setItem("tier",tier)}
if(o.mode&&["smart","card","quiz","type","dict"].includes(o.mode)){mode=o.mode;localStorage.setItem("mode",mode)}
Q=[];qi=0;doneCnt=0;combo=0;maxCombo=0;sessionWrong=[];historyStack=[];
sessionStorage.removeItem("cet6_sess");
applyTheme(CFG.theme);applyWall();save();
msg="🎉 导入恢复成功！";showToast("学习进度已完整恢复");render();
}else{msg="备份格式不正确：缺少有效的 srs 字段";render()}
}catch(e){msg="JSON 解析失败："+e.message;render()}
}
function openResetModal(){
const learnedCnt=WORDS.filter(x=>isLearned(x.w)).length;
R("modal-root",`<div class="modal-mask" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="closeModal()"><div class="modal-card" onclick="event.stopPropagation()"><h3 id="modal-title" style="margin:0 0 8px;font-size:var(--fs-h2);color:var(--bad)">确认清空所有学习进度？</h3><p style="margin:0 0 20px;color:var(--ink-2)">这将永久删除本机保存的 <b>${learnedCnt}</b> 个已学单词的 FSRS 记忆曲线与打卡历史。建议清空前先导出备份。</p><div class="row" style="gap:12px"><button type="button" class="btn subtle f1" onclick="closeModal()">取消</button><button type="button" class="btn danger f1" onclick="confirmReset()">确认永久清空</button></div></div></div>`);
}
function closeModal(){
R("modal-root","");
render();
}
window.closeModal=closeModal;
function confirmReset(){
S={};H={};Q=[];qi=0;doneCnt=0;combo=0;maxCombo=0;sessionWrong=[];historyStack=[];
sessionStorage.removeItem("cet6_sess");save();closeModal();showToast("已清空所有学习记录");
}

// 跨天温柔衔接：绝不打断正在深夜背词的用户队列
let __day=new Date().toDateString();
function checkDay(){
const d=new Date().toDateString();
if(d!==__day){
__day=d;
if(page!=="study"){
sessionStorage.removeItem("cet6_sess");
render();
}
}
}
setInterval(checkDay,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDay()});
render();
if(storageRecovered)setTimeout(()=>showToast("检测到损坏的本地缓存，已自动修复重置"),400);
</script>
