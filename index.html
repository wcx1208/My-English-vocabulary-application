<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的六级单词</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--ink:#1c1e21;--sub:#6b7280;--line:#e5e7eb;
  --brand:#3b5bdb;--brand2:#5c7cfa;--ok:#2f9e44;--warn:#e8a90c;--bad:#e03131;
  --shadow:0 2px 10px rgba(20,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14161a;--card:#1e2126;--ink:#e8eaed;--sub:#9aa0a6;--line:#2a2e34;--shadow:0 2px 10px rgba(0,0,0,.35)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  transition:background .3s}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;padding:14px 16px calc(12px);box-shadow:var(--shadow)}
header .bar{display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
.chip{background:rgba(255,255,255,.18);padding:4px 10px;border-radius:12px;font-size:12px}
.tabs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:6px 14px;border-radius:16px;background:rgba(255,255,255,.15);
  font-size:13px;cursor:pointer;border:1px solid transparent;transition:.2s}
.tab.on{background:#fff;color:var(--brand);font-weight:600}
main{max-width:680px;margin:0 auto;padding:14px 14px 90px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.box h3{margin:0 0 8px;font-size:14px;color:var(--sub);font-weight:600}
.num{font-size:26px;font-weight:700}
.num small{font-size:12px;color:var(--sub);font-weight:400}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:4px;transition:width .4s}
.modes{display:flex;gap:8px;margin:14px 0}
.mode{flex:1;text-align:center;padding:12px 4px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);cursor:pointer;font-size:13px;transition:.15s}
.mode .ico{font-size:22px;display:block;margin-bottom:4px}
.mode.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--card));color:var(--brand);font-weight:600}
button{font-family:inherit}
.btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:12px 18px;
  font-size:15px;cursor:pointer;width:100%;transition:.15s;font-weight:600}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:6px 12px;font-size:13px;width:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 18px;
  text-align:center;box-shadow:var(--shadow);min-height:260px;display:flex;flex-direction:column;justify-content:center;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.w{font-size:38px;font-family:Georgia,"Times New Roman",serif;line-height:1.2}
.ipa{color:var(--sub);margin-top:6px;font-size:15px}
.meaning{font-size:18px;margin-top:14px}
.note{font-size:14px;color:var(--sub);margin-top:8px;white-space:pre-wrap;text-align:left;
  background:color-mix(in srgb,var(--brand) 5%,transparent);border-radius:8px;padding:8px 10px}
.tap{color:var(--sub);font-size:15px}
.next{font-size:12px;color:var(--sub);margin-top:10px}
.grades{display:flex;gap:10px;margin-top:14px}
.grades button{flex:1;border:none;color:#fff;font-size:15px;padding:14px 0;border-radius:12px;font-weight:600}
.g0{background:var(--bad)}.g1{background:var(--warn)}.g2{background:var(--ok)}
.opts button{display:block;width:100%;margin:8px 0;padding:13px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card));font-weight:600}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.tinput{width:100%;font-size:24px;font-family:Georgia,serif;text-align:center;padding:12px;
  border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);outline:none}
.tinput.right{border-color:var(--ok)}.tinput.wrong{border-color:var(--bad)}
.tip{font-size:12px;color:var(--sub);margin-top:6px}
.sess{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:10px}
.list li{padding:12px 4px;border-bottom:1px solid var(--line);list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
.list li b{font-size:17px}
.list .m{font-size:13px;color:var(--sub);margin-top:3px}
.badge{font-size:11px;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad);flex:0 0 auto}
.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;
  background:var(--card);color:var(--ink);margin-bottom:10px;outline:none}
.heat{display:flex;gap:4px;margin-top:8px}
.heat i{flex:1;height:26px;border-radius:5px;background:var(--line);position:relative;font-size:9px;color:var(--sub);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.heat i b{width:100%;background:linear-gradient(180deg,var(--brand2),var(--brand));opacity:.9}
.heat i span{position:absolute;top:2px;width:100%;text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;z-index:10;max-width:680px;margin:0 auto}
nav button{flex:1;background:none;border:none;padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  font-size:12px;color:var(--sub);cursor:pointer}
nav button.on{color:var(--brand);font-weight:700}
nav .ico{font-size:20px;display:block}
textarea{width:100%;height:90px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--ink);font-size:12px;padding:8px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.setrow select{padding:6px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>我的六级单词</h1>
    <span class="chip" id="streak"></span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<script src="data.js"></script>
<script>
/* ===== 数据层 ===== */
const TIERS=[["J","进阶"],["H","核心"],["T","拓展"],["B","基础"]];
const DAY=86400000;
let S=J("srs",{}), H=J("hist",{}), CFG=Object.assign({daily:20,auto:false},J("cfg",{}));
let tier=localStorage.tier||"C", page="home", mode=localStorage.mode||"card";
if(!TIERS.some(x=>x[0]===tier))tier="C";
function J(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
const save=()=>{localStorage.srs=JSON.stringify(S);localStorage.hist=JSON.stringify(H);localStorage.cfg=JSON.stringify(CFG)};
const today=()=>new Date().toDateString();
const due=w=>{const s=S[w];return !s||s.due<=Date.now()};
const mastered=w=>{const s=S[w];return s&&s.iv>=8};
function next(s,g){let e=s?s.ease:2.5,iv=s?s.iv:0;
  if(g===0){e-=.2;iv=0}else if(g===1){e-=.05;iv=Math.max(1,iv)}else{e+=.1;iv=iv===0?1:Math.round(iv*e)}
  e=Math.min(3,Math.max(1.3,e));iv=Math.min(180,Math.max(0,iv));
  return{iv,e,due:Date.now()+(g===0?600000:iv*DAY),r:(s?s.r:0)+1,g}}
function bump(){const t=today();H[t]=(H[t]||0)+1;H[t+"_"+tier]=(H[t+"_"+tier]||0)+1;save()}
function streakDays(){let n=0,d=new Date();while(H[d.toDateString()]){n++;d.setDate(d.getDate()-1)}return n}
function pool(t){return WORDS.filter(x=>x.t===t)}
function session(t){
  const p=pool(t);
  const dueW=p.filter(x=>S[x.w]&&due(x.w));
  const fresh=p.filter(x=>!S[x.w]);
  return dueW.concat(fresh).sort(()=>Math.random()-.5);
}
function nextTxt(g,s){const s2=next({s,g},2),iv=s2.iv;
  return "下次复习："+(iv<=1?"明天":iv+" 天后")}

/* ===== 会话状态 ===== */
let Q=[],qi=0,revealed=false,quizPick=-1,typed="",checked=false,doneCnt=0;

/* ===== 渲染 ===== */
function R(id,h){document.getElementById(id).innerHTML=h}
function render(){
  R("streak","🔥 连续 "+streakDays()+" 天 · 今日 "+(H[today()]||0)+" 次");
  R("tabs",TIERS.map(([k,l])=>`<div class="tab ${k===tier?'on':''}" onclick="setTier('${k}')">${l}</div>`).join(""));
  R("nav",[["home","🏠","概览"],["study","📖","学习"],["wrong","📕","错词"],["list","📋","词表"],["stat","📊","统计"],["set","⚙️","设置"]]
    .map(([k,i,l])=>`<button class="${page===k?'on':''}" onclick="go('${k}')"><span class="ico">${i}</span>${l}</button>`).join(""));
  const m=document.getElementById("main");
  const p=pool(tier),dueN=p.filter(x=>due(x)&&S[x.w]).length,freshN=p.filter(x=>!S[x.w]).length,mastN=p.filter(x=>mastered(x.w)).length;
  if(page==="home"){
    const todayN=H[today()]||0, goal=(CFG.daily*2).coerceAtLeast(10);
    let sk=0,d0=new Date();while(H[d0.toDateString()]){sk++;d0.setDate(d0.getDate()-1)}
    m.innerHTML=`<div class="box" style="display:flex;align-items:center;gap:16px">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="26" fill="none" stroke="#e5e7eb" stroke-width="8"/>
        <circle cx="32" cy="32" r="26" fill="none" stroke="#2f9e44" stroke-width="8"
          stroke-linecap="round" transform="rotate(-90 32 32)"
          stroke-dasharray="${Math.min(1,todayN/goal)*163.4} 163.4"/>
      </svg>
      <div><div style="font-size:16px;font-weight:600">今日目标  ${todayN} / ${goal} 次</div>
      <div style="font-size:13px;color:#e8a90c">连续打卡 ${sk} 天 🔥</div></div></div>`+`
    <div class="grid">
      <div class="box"><h3>待复习</h3><div class="num">${dueN}</div><div class="pbar"><i style="width:${p.length?100*(p.length-freshN-dueN)/(p.length):0}%"></i></div></div>
      <div class="box"><h3>新词（不限量）</h3><div class="num">${Math.min(freshN,CFG.daily)}</div><small style="color:var(--sub);font-size:12px">剩余新词 ${freshN}</small></div>
      <div class="box"><h3>已形成记忆（间隔≥8天）</h3><div class="num">${mastN}<small> / ${p.length}</small></div><div class="pbar"><i style="width:${p.length?100*mastN/p.length:0}%"></i></div></div>
      <div class="box"><h3>本组学习总次数</h3><div class="num">${H[today()+"_"+tier]||0}</div><small style="color:var(--sub);font-size:12px">今日</small></div>
    </div>
    <div class="modes">
      <div class="mode ${mode==='card'?'on':''}" onclick="setMode('card')"><span class="ico">🃏</span>卡片认词</div>
      <div class="mode ${mode==='quiz'?'on':''}" onclick="setMode('quiz')"><span class="ico">🅰️</span>释义选择</div>
      <div class="mode ${mode==='type'?'on':''}" onclick="setMode('type')"><span class="ico">⌨️</span>拼写模式</div>
    </div>
    <button class="btn" onclick="start()">开始学习（${Math.min(dueN+Math.min(freshN,CFG.daily),dueN+CFG.daily)} 词）</button>
    <p class="tip" style="text-align:center;margin-top:10px">拼写模式学习自 TypeWords；选择题学习自百词斩；间隔复习学习自 Anki</p>`;
  }else if(page==="study"){
    const w=Q[qi];
    if(!w){m.innerHTML=`<div class="card"><div style="font-size:44px">🎉</div>
      <div class="meaning">本组完成！共复习 ${doneCnt} 次</div>
      <div class="note">不认识的词已排入 10 分钟后及错词本，明天记得回来——间隔重复的效果在"隔天再见"</div>
      <button class="btn ghost" style="margin-top:14px" onclick="go('home')">返回概览</button></div>`;return}
    const st=S[w.w];
    let body="";
    if(mode==="card"){
      body=`<div class="w">${w.w}</div>${w.i?`<div class="ipa">${w.i}</div>`:""}
      <div style="margin:8px 0"><button class="btn ghost sm" onclick="play('${esc(w.w)}')">🔊 发音</button></div>
      ${revealed?`<div class="meaning">${w.m}</div>${w.n?`<div class="note">${w.n}</div>`:""}
        <div class="next">${nextTxt(2,st)}</div>
        <div class="grades">
          <button class="g0" onclick="grade(0)">不认识</button>
          <button class="g1" onclick="grade(1)">模糊</button>
          <button class="g2" onclick="grade(2)">认识</button></div>`
        :`<div class="meaning tap" onclick="reveal()">👆 点按显示释义</div>`}`;
    }else if(mode==="quiz"){
      const opts=w._opts||[];
      if(!revealed){
        body=`<div class="w">${w.w}</div>${w.i?`<div class="ipa">${w.i}</div>`:""}
        <div class="tip">选出正确释义</div><div class="opts" style="margin-top:10px">`+
        opts.map((o,i)=>`<button onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")+`</div>`;
      }else{
        body=`<div class="w">${w.w}</div>${w.i?`<div class="ipa">${w.i}</div>`:""}
        <div class="opts" style="margin-top:10px">`+
        opts.map((o,i)=>`<button class="${i===w._ans?'right':(i===quizPick?'wrong':'')}" disabled>${String.fromCharCode(65+i)}. ${o}</button>`).join("")+
        `</div><div class="grades">
          <button class="g2" onclick="grade(${quizPick===w._ans?2:0})">${quizPick===w._ans?'答对了，下一个':'记住了，下一个'}</button></div>`;
      }
    }else{ /* type 拼写模式：看释义拼单词（TypeWords 式）*/
      body=`<div class="meaning" style="font-size:20px">${w.m}</div>
      ${w.n?`<div class="note">${w.n}</div>`:""}
      ${checked?`<div style="margin-top:14px"><div class="w" style="font-size:30px;color:${typed.toLowerCase()===w.w.toLowerCase()?'var(--ok)':'var(--bad)'}">${w.w}</div>
        ${w.i?`<div class="ipa">${w.i}</div>`:""}
        <div class="tip">你输入：${typed||"（空）"}</div>
        <div class="grades"><button class="g0" onclick="grade(0)">没记住</button><button class="g2" onclick="grade(${typed.toLowerCase()===w.w.toLowerCase()?2:1})">继续</button></div></div>`
      :`<input id="ti" class="tinput" placeholder="输入英文后回车" value="${typed}" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="tip">回车提交 · 看提示按 H 键</div>
        <div class="grades"><button class="btn ghost" style="flex:1;padding:13px" onclick="checkType(true)">不会，看答案</button></div>`}`;
    }
    m.innerHTML=`<div class="sess"><span>${qi+1} / ${Q.length} · ${w.c||""}</span><button class="btn ghost sm" onclick="go('home')">退出</button></div>
    <div class="card">${body}</div>`;
    if(CFG.auto&&!revealed)play(w.w);
    const ti=document.getElementById("ti");
    if(ti){ti.oninput=e=>typed=e.target.value;ti.onkeydown=e=>{if(e.key==="Enter")checkType(false);if(e.key.toLowerCase()==="h"){ti.value=w.w;ti.dispatchEvent(new Event("input"))}};ti.focus()}
  }else if(page==="wrong"){
    const wrong=WORDS.filter(x=>S[x.w]&&S[x.w].g===0).concat(WORDS.filter(x=>S[x.w]&&S[x.w].iv===0&&S[x.w].r>0));
    const uniq=[...new Set(wrong)];
    m.innerHTML=`<h3 style="margin:4px 0 10px;font-size:15px">错词本（${uniq.length} 词，最近答错或仍卡在第一步的词）</h3>
    ${uniq.length?`<button class="btn" onclick="drillWrong()">🔁 立即重练这些词</button><ul class="list" style="padding:0;margin-top:12px">`+
      uniq.map(x=>`<li onclick="play('${esc(x.w)}')"><div><b>${x.w}</b><div class="m">${x.m}</div></div><span class="badge">重练</span></li>`).join("")+`</ul>`
      :`<div class="box" style="text-align:center;color:var(--sub)">暂无错词，保持住！</div>`}`;
  }else if(page==="list"){
    m.innerHTML=`<input class="search" id="q" placeholder="搜索单词或释义…" oninput="renderList()">
    <ul class="list" id="lv" style="padding:0;margin:0"></ul>`;
    renderList();
  }else if(page==="stat"){
    const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
    const mx=Math.max(1,...days.map(d=>H[d.toDateString()]||0));
    m.innerHTML=`<div class="box"><h3>最近 7 天学习次数</h3>
      <div class="heat">`+days.map(d=>{const c=H[d.toDateString()]||0;
        return `<i><span>${("日一二三四五六")[d.getDay()]}</span><b style="height:${100*c/mx}%"></b></i>`}).join("")+`</div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px">${days.map(d=>d.getMonth()+1+"/"+d.getDate()).join(" · ")}</div></div>
    <div class="box" style="margin-top:12px"><h3>各组进度（已启动/形成记忆）</h3>`+
      TIERS.map(([k,l])=>{const p=pool(k),st=p.filter(x=>S[x.w]).length,mt=p.filter(x=>mastered(x.w)).length;
        return `<div class="setrow"><span>${l}</span><span>${st}/${p.length} · 记忆 ${mt}</span></div><div class="pbar" style="margin:0 0 10px"><i style="width:${p.length?100*st/p.length:0}%"></i></div>`}).join("")+`</div>
    <div class="box" style="margin-top:12px"><h3>总计</h3><div class="num">${Object.keys(S).length}<small> / ${WORDS.length} 词已启动</small></div></div>`;
  }else{ /* set */
    m.innerHTML=`<div class="box">
      <div class="setrow"><span>每日新词数量</span><select onchange="CFG.daily=+this.value;save();render()">
        ${[10,15,20,30,50].map(n=>`<option value="${n}" ${CFG.daily===n?"selected":""}>${n}</option>`).join("")}</select></div>
      <div class="setrow"><span>卡片模式自动发音</span><select onchange="CFG.auto=this.value==='1';save();render()">
        <option value="0" ${!CFG.auto?"selected":""}>关</option><option value="1" ${CFG.auto?"selected":""}>开</option></select></div>
    </div>
    <div class="box" style="margin-top:12px"><h3>进度备份（换手机/浏览器前先导出）</h3>
      <button class="btn ghost" onclick="exportP()">导出进度到剪贴板</button>
      <textarea id="imp" placeholder="或把之前导出的 JSON 粘贴到这里，然后点导入" style="margin-top:10px"></textarea>
      <button class="btn" style="margin-top:8px" onclick="importP()">导入进度</button></div>
    <p class="tip" style="text-align:center">数据仅存本机浏览器 localStorage；清浏览器数据前记得导出</p>`;
  }
}
function renderList(){
  const q=(document.getElementById("q").value||"").trim().toLowerCase();
  const list=WORDS.filter(x=>x.t===tier&&(!q||x.w.toLowerCase().includes(q)||x.m.includes(q)));
  document.getElementById("lv").innerHTML=list.map(x=>
    `<li onclick="play('${esc(x.w)}')"><div><b>${x.w}</b> <span class="ipa" style="font-size:12px">${x.i||""}</span><div class="m">${x.m}${x.n?"　·　"+x.n:""}</div></div>${S[x.w]&&S[x.w].g===0?'<span class="badge">错</span>':""}</li>`).join("");
}
/* ===== 交互 ===== */
const esc=s=>s.replace(/'/g,"\\'").replace(/"/g,"&quot;");
function setTier(k){tier=k;localStorage.tier=k;render()}
function setMode(md){mode=md;localStorage.mode=md;render()}
function go(p){page=p;revealed=false;render();window.scrollTo(0,0)}
function start(){Q=session(tier);qi=0;revealed=false;doneCnt=0;
  if(mode==="quiz")Q.forEach(w=>{const others=pool(tier).filter(x=>x.w!==w.w).map(x=>x.m).sort(()=>Math.random()-.5).slice(0,3);
    w._opts=w.m.concat? [w.m,...others].sort(()=>Math.random()-.5):[];w._ans=w._opts.indexOf(w.m)});
  page="study";render()}
function drillWrong(){Q=WORDS.filter(x=>S[x.w]&&(S[x.w].g===0||S[x.w].iv===0&&S[x.w].r>0));qi=0;doneCnt=0;page="study";render()}
function reveal(){revealed=true;render()}
function play(w){try{new Audio("https://dict.youdao.com/dictvoice?type=1&audio="+encodeURIComponent(w)).play().catch(()=>{})}catch(e){}}
function grade(g){const w=Q[qi];if(!w)return;
  S[w.w]=next(S[w.w],g);bump();doneCnt++;
  if(g===0)Q.push(w);   /* 不认识：本轮末尾再出现一次 */
  qi++;revealed=false;quizPick=-1;typed="";checked=false;render()}
function pick(i){const w=Q[qi];quizPick=i;revealed=true;
  if(i===w._ans)play(w.w);render()}
function checkType(giveUp){const w=Q[qi];if(!w)return;
  const ti=document.getElementById("ti");if(ti)typed=ti.value;
  checked=true;render()}
function exportP(){navigator.clipboard.writeText(JSON.stringify({srs:S,hist:H,cfg:CFG})).then(()=>alert("进度已复制，粘贴到备忘录保存即可"))}
function importP(){try{const o=JSON.parse(document.getElementById("imp").value);
  if(o.srs){S=o.srs;H=o.hist||{};CFG=Object.assign(CFG,o.cfg||{});save();alert("导入成功");render()}else alert("格式不对")}
  catch(e){alert("解析失败："+e.message)}}
render();
</script>
</body>
