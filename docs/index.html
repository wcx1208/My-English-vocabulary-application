function defaultExamDate(){

if(recExact>=recSafe)recExact=Math.max(5,recSafe-1);
const recCore=freshN>0?Math.min(500,Math.max(5,Math.ceil((highFreshN||Math.round(freshN*.6))/daysLeft))):10;

const altTitle=useCoreAlt?"⚡ 核心高频保底":"⚡ 考前踩线均摊";
const altDesc=useCoreAlt?`优先攻克 ${highFreshN} 个★★★高频词`:`不留缓冲期，考前刚好背完`;

let filteredWords=[],lastListScroll=0;const ROW_H=72;
function rebuildVirtualList(reset){
const q=listQuery.trim().toLowerCase();
filteredWords=WORDS.filter(x=>{
if(listFilter==="tier"&&x.t!==tier)return false;
if(listFilter==="due"&&!(S[x.w]&&due(x.w)))return false;
if(listFilter==="mastered"&&!mastered(x.w))return false;
if(listFilter==="unlearned"&&S[x.w])return false;
return !q||x.w.toLowerCase().includes(q)||x.m.includes(q)||(x.n&&x.n.toLowerCase().includes(q));
});
if(listSort==="imp")filteredWords.sort((a,b)=>(b.imp||2)-(a.imp||2));
else if(listSort==="wrong")filteredWords.sort((a,b)=>((S[b.w]?.wCnt||0)-(S[a.w]?.wCnt||0)));
const cEl=document.getElementById("list-count");if(cEl)cEl.textContent=`${filteredWords.length}词`;
const vp=document.getElementById("v-port");if(vp)vp.scrollTop=reset?0:lastListScroll;
onVScroll();
}
function onVScroll(){
const vp=document.getElementById("v-port"),sp=document.getElementById("v-spacer");if(!vp||!sp)return;
lastListScroll=vp.scrollTop;
const total=filteredWords.length;
if(!total){sp.style.height="260px";sp.innerHTML=`<div class="tc sub" style="padding:64px 16px">没有找到匹配的单词，试试其它关键词或切换筛选范围。</div>`;return}
sp.style.height=(total*ROW_H)+"px";
const st=vp.scrollTop,vh=vp.clientHeight||500,s=Math.max(0,Math.floor(st/ROW_H)-4),e=Math.min(total,Math.ceil((st+vh)/ROW_H)+5);
let h="";
for(let i=s;i<e;i++){
const x=filteredWords[i],sr=S[x.w];

function prepQuiz(list){
const allPool=pool(tier);
list.forEach(w=>{
const pos=(w.m.match(/^[a-z]+\./i)||[""])[0];
const cfWords=(w.cf||[]).map(([cw])=>WORD_MAP.get(cw.toLowerCase())).filter(x=>x&&x.w!==w.w);
const samePos=allPool.filter(x=>x.w!==w.w&&pos&&x.m.startsWith(pos));
const cand=[...cfWords,...samePos,...allPool.filter(x=>x.w!==w.w)];
const picked=[];
for(const c of cand){if(picked.length>=3)break;if(c&&c.m!==w.m&&!picked.includes(c.m))picked.push(c.m)}
w._opts=[w.m,...picked].sort(()=>Math.random()-.5);w._ans=w._opts.indexOf(w.m);
});
}
function initStudyQueue(words){
Q=words;qi=0;revealed=false;quizPick=-1;typed="";retryTyped="";checked=false;doneCnt=0;combo=0;maxCombo=0;hintLv=0;dictPeek=false;sessionWrong=[];historyStack=[];

function play(w){

a.onended=()=>{ok=true;clearTimeout(tm)};a.onerror=()=>{if(!ok){ok=true;clearTimeout(tm);tts(w)}};
const p=a.play();if(p&&p.catch)p.catch(()=>{if(!ok){ok=true;clearTimeout(tm);tts(w)}});
}catch(e){tts(w)}

function playSentence(t){

function playLongSentence(s){

var done=false,tm=setTimeout(function(){if(!done){done=true;showToast("例句朗读需联网")}},4000);
a.onended=function(){done=true;clearTimeout(tm)};
a.onerror=function(){if(!done){done=true;clearTimeout(tm);showToast("例句朗读需联网")}};
var p=a.play();
if(p&&p.catch)p.catch(function(){if(!done){done=true;clearTimeout(tm);showToast("例句朗读需联网")}});
}catch(e){showToast("例句朗读需联网")}
}
function tts(w){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.92;speechSynthesis.speak(u)}catch(e){}}
function grade(g){
clearTimeout(window.__qzTimer);
const w=Q[qi];if(!w)return;
historyStack.push({qi,word:w.w,prevS:S[w.w]?Object.assign({},S[w.w]):null,prevCombo:combo,prevMaxCombo:maxCombo,qLen:Q.length,swLen:sessionWrong.length});
S[w.w]=next(S[w.w],g);bump(1);doneCnt++;
if(g===0){combo=0;sessionWrong.push(w);Q.push(w);cardBounce="bounce-bad"}
else{combo++;if(combo>maxCombo)maxCombo=combo;cardBounce="bounce-ok"}
qi++;revealed=false;quizPick=-1;typed="";retryTyped="";checked=false;hintLv=0;dictPeek=false;
saveSession();render();if(Q[qi]&&(CFG.auto||mode==="dict"))play(Q[qi].w);
}
function killWord(){

historyStack.push({qi,word:w.w,prevS:S[w.w]?Object.assign({},S[w.w]):null,prevCombo:combo,prevMaxCombo:maxCombo,qLen:Q.length,swLen:sessionWrong.length});
S[w.w]={iv:30,e:2.6,ease:2.6,due:Date.now()+30*DAY,r:(S[w.w]?.r||0)+1,wCnt:S[w.w]?.wCnt||0,star:false,g:2};
bump(1);doneCnt++;combo++;if(combo>maxCombo)maxCombo=combo;
qi++;revealed=false;quizPick=-1;typed="";retryTyped="";checked=false;hintLv=0;dictPeek=false;
saveSession();showToast(`⚡ 已斩词：${w.w}（30天内不再打扰）`);render();

function prevWord(){
clearTimeout(window.__qzTimer);
if(!historyStack.length)return;
const ls=historyStack.pop();
if(ls.prevS)S[ls.word]=ls.prevS;else delete S[ls.word];
while(Q.length>ls.qLen)Q.pop();
while(sessionWrong.length>ls.swLen)sessionWrong.pop();
qi=ls.qi;combo=ls.prevCombo;maxCombo=ls.prevMaxCombo;doneCnt=Math.max(0,doneCnt-1);
bump(-1);revealed=true;checked=mode==="type"||mode==="dict";

function bindStudySwipe(){

c.addEventListener("touchstart",e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;tr=true}},{passive:true});
c.addEventListener("touchmove",e=>{if(!tr)return;dx=e.touches[0].clientX-sx;const dy=e.touches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>15)c.style.transform=`translateX(${dx*.35}px) rotate(${dx*.02}deg)`},{passive:true});
c.addEventListener("touchend",()=>{if(!tr)return;tr=false;c.style.transform="";if(Math.abs(dx)>68){if(!revealed&&mode==="card"){reveal();return}grade(dx<0?0:2)}});

window.addEventListener("keydown",e=>{
if(page!=="study"||!Q[qi])return;
const tg=document.activeElement?document.activeElement.tagName:"";
if(tg==="INPUT"||tg==="TEXTAREA"){if(e.key==="Escape"){document.activeElement.blur();go("home")}return}
if(e.key==="Escape"){e.preventDefault();go("home");return}
if(e.key==="ArrowLeft"){e.preventDefault();prevWord();return}
if(e.key.toLowerCase()==="s"){e.preventDefault();toggleStar(Q[qi].w);return}
if(e.key.toLowerCase()==="m"||e.key==="Delete"){e.preventDefault();killWord();return}
if(e.key===" "||e.code==="Space"){
e.preventDefault();
if(mode==="card"&&!revealed)reveal();
else if(mode==="quiz"&&revealed)grade(quizPick===Q[qi]._ans?2:0);
else if((mode==="type"||mode==="dict")&&checked)grade(typed.trim().toLowerCase()===Q[qi].w.toLowerCase()?2:0);
return;
}
if(mode==="quiz"&&!revealed){const ix=["1","2","3","4","a","b","c","d"].indexOf(e.key.toLowerCase());if(ix!==-1){e.preventDefault();pick(ix%4);return}}
if(revealed||checked){if(e.key==="1"){e.preventDefault();grade(0)}else if(e.key==="2"){e.preventDefault();grade(1)}else if(e.key==="3"){e.preventDefault();grade(2)}}
});

<div style="font-size:36px">🏆</div><h3 style="margin:6px 0">我的六级备考成绩单</h3>
<p class="sub" style="margin:0 0 14px">${escH(quoteOf().q)}</p>
<div class="stat-grid-4 box" style="margin-bottom:16px;background:var(--surface)">
<div><div class="xs">连续签到</div><div class="num-xl" style="color:var(--warn)">${sk}<small>天</small></div></div>
<div><div class="xs">今日学习</div><div class="num-xl">${tn}<small>次</small></div></div>
<div><div class="xs">累计已学</div><div class="num-xl" style="color:var(--brand)">${tot}<small>词</small></div></div>
<div><div class="xs">长期记牢</div><div class="num-xl" style="color:var(--ok)">${mast}<small>词</small></div></div>
</div>
<div class="row"><button type="button" class="btn subtle f1" onclick="closeModal()">关闭</button><button type="button" class="btn f1" onclick="navigator.clipboard?.writeText('${esc(shareTxt)}');closeModal();showToast('🎉 打卡成绩已复制，快去分享吧')">复制成绩单</button></div>
</div></div>`);
}
function exportP(){
const j=JSON.stringify({srs:S,hist:H,cfg:CFG}),imp=document.getElementById("imp");if(imp)imp.value=j;
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(j).then(()=>{msg="✅ 进度已复制到剪贴板，同时显示在下方文本框中";showToast("已复制备份 JSON");render()}).catch(()=>{msg="已生成备份 JSON，请全选复制上方文本框内容保存";render()});
else{msg="已生成备份 JSON，请全选复制上方文本框内容保存";render()}
}
function importP(){
try{
const v=(document.getElementById("imp")?.value||"").trim();if(!v){msg="请先粘贴备份 JSON 内容";render();return}
const o=JSON.parse(v);
if(o&&typeof o.srs==="object"){S=o.srs;H=o.hist||{};CFG=Object.assign(CFG,o.cfg||{});applyTheme(CFG.theme);save();msg="🎉 导入恢复成功！";showToast("学习进度已恢复");render()}
else{msg="备份格式不正确：缺少 srs 字段";render()}
}catch(e){msg="JSON 解析失败："+e.message;render()}
}
function openResetModal(){
R("modal-root",`<div class="modal-mask" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="closeModal()"><div class="modal-card" onclick="event.stopPropagation()"><h3 id="modal-title" style="margin:0 0 8px;font-size:var(--fs-h2);color:var(--bad)">确认清空所有学习进度？</h3><p style="margin:0 0 20px;color:var(--ink-2)">这将永久删除本机保存的 <b>${Object.keys(S).length}</b> 个单词记忆曲线与连续打卡记录。建议清空前先在上方导出备份。</p><div class="row" style="gap:12px"><button type="button" class="btn subtle f1" onclick="closeModal()">取消</button><button type="button" class="btn danger f1" onclick="confirmReset()">确认永久清空</button></div></div></div>`);
}
function closeModal(){R("modal-root","")}
function confirmReset(){S={};H={};sessionStorage.removeItem("cet6_sess");save();closeModal();showToast("已清空所有学习记录");render()}

let __day=new Date().toDateString();
function checkDay(){const d=new Date().toDateString();if(d!==__day){__day=d;Q=[];qi=0;revealed=false;quizPick=-1;typed="";checked=false;doneCnt=0;sessionStorage.removeItem("cet6_sess");if(page==="study")page="home";render()}}
setInterval(checkDay,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDay()});
render();
if(storageRecovered)setTimeout(()=>showToast("检测到损坏的本地缓存，已自动修复重置"),400);
</script>
</body>
</html>
